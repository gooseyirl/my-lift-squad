name = "myliftsquad-web"
main = "src/index.ts"
compatibility_date = "2025-04-22"
workers_dev = true
preview_urls = false

# The import tool is served straight from ./public. Static assets win over the
# Worker script, so "/" resolves to public/index.html and only /api/* reaches
# the fetch handler.
[assets]
directory = "./public"

# myliftsquad.com is the tool's public home; wrangler creates and keeps the DNS
# record in the Cloudflare zone. The workers.dev URL stays live as a fallback.
[[routes]]
pattern = "myliftsquad.com"
custom_domain = true

[[kv_namespaces]]
binding = "SHARES"
id = "bfff7bb8acd34529b610e7f1613ab9e0"
