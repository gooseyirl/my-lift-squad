name = "myliftsquad-web"
main = "src/index.ts"
compatibility_date = "2025-04-22"
workers_dev = true
preview_urls = false

# The import tool is served straight from ./public. Static assets win over the
# Worker script, so "/" resolves to public/index.html and only /api/* reaches
# the fetch handler.
[assets]
directory = "./public"

# The tool's public home. Cloudflare creates and manages the DNS record for a
# custom domain itself, so the zone needs no A record of its own.
[[routes]]
pattern = "myliftsquad.com"
custom_domain = true

[[kv_namespaces]]
binding = "SHARES"
id = "bfff7bb8acd34529b610e7f1613ab9e0"
