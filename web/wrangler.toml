name = "myliftsquad-web"
main = "src/index.ts"
compatibility_date = "2025-04-22"
workers_dev = true
preview_urls = false

# The import tool is served straight from ./public. Static assets win over the
# Worker script, so "/" resolves to public/index.html and only /api/* reaches
# the fetch handler.
[assets]
directory = "./public"

# myliftsquad.com is the tool's public home, but the zone lives in a different
# Cloudflare account (paulwalshirl@) than this worker (gooseyirl@), and a worker
# can only bind a hostname in its own account. Binding it fails every deploy
# with a red "triggers failed" error, so it stays commented out and a redirect
# rule on the zone forwards to workers.dev in the meantime.
#
# Cloudflare blocks account transfers for the first 10 days after registration
# (registered 2026-07-29), so from 2026-08-08: move the domain to gooseyirl@,
# uncomment this, deploy, and delete the redirect rule.
#
# [[routes]]
# pattern = "myliftsquad.com"
# custom_domain = true

[[kv_namespaces]]
binding = "SHARES"
id = "bfff7bb8acd34529b610e7f1613ab9e0"
