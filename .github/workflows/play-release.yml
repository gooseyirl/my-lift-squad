# Builds a signed release of the Android app and uploads it to Google Play.
#
# Run it from GitHub: Actions tab > "Release to Google Play" > Run workflow,
# then pick the Play track. Pushing a tag that starts with "v" (e.g. v2.3.6)
# also runs it and uploads to the internal track.
#
# Bump versionCode before each release: Google Play rejects a versionCode it
# has already seen. One-time setup (secrets, Play service account) is in
# .github/PLAY_RELEASE_SETUP.md.

name: Release to Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: Google Play track
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: "completed = roll out now, draft = wait for you to press Release in Play Console"
        type: choice
        options: [completed, draft]
        default: completed
  push:
    tags: ['v*']

concurrency:
  group: play-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  PACKAGE_NAME: com.gooseco.myliftsquad

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check secrets are set
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD PLAY_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set. See .github/PLAY_RELEASE_SETUP.md"
              missing=1
            fi
          done
          exit $missing

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history and tags, in case the version comes from git tags

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      # Signing is injected the same way Android Studio's "Generate Signed Bundle"
      # does it, so build.gradle needs no signing config and no passwords in git.
      - name: Build signed bundle (AAB) and APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Save AAB and APK as a download
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: ${{ inputs.track || 'internal' }}
          status: ${{ inputs.status || 'completed' }}

      - name: Clean up signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" android/local.properties
